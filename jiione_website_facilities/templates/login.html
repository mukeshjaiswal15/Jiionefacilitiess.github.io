{% extends "base.html" %}
{% block title %}Client Login — Jii One Facilities{% endblock %}
{% block content %}
<section>
  <div class="container">
    <div class="framed form-shell">
      <h2>Client Login</h2>
      <div class="sub">Sign in to view your account.</div>
      <form method="POST" action="{{ url_for('login') }}">
        <input type="hidden" name="next" value="{{ next }}">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autofocus>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-solid">Log In</button>
      </form>
      <div class="form-foot">
        New here? <a href="{{ url_for('register', next=next) }}">Create an account</a><br>
        <a href="{{ url_for('admin_login') }}">Admin login</a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
